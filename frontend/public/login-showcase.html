<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymBro — Member Access</title>
  <meta name="description" content="Access your personalized GymBro workout tracking, routine logs, and fitness metrics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #0b131e;
      --bg-surface: #0e1726;
      --bg-card: rgba(15, 25, 42, 0.72);
      --bg-input: rgba(8, 14, 25, 0.65);
      --bg-input-focus: rgba(13, 22, 38, 0.95);
      
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --accent-blue-subtle: rgba(59, 130, 246, 0.12);
      --accent-blue-border: rgba(59, 130, 246, 0.4);
      --accent-glow: rgba(59, 130, 246, 0.22);
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --text-dim: #475569;
      
      --danger: #ef4444;
      --danger-subtle: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.28);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 9999px;
      
      --transition-standard: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      width: 100%;
      background-color: var(--bg-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    /* Ambient dark-navy atmosphere gradients */
    body::before {
      content: "";
      position: absolute;
      width: 580px;
      height: 580px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(14, 23, 38, 0) 70%);
      top: -120px;
      right: -80px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: absolute;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.06) 0%, rgba(7, 13, 24, 0) 70%);
      bottom: -150px;
      left: -120px;
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle grid line overlay */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      pointer-events: none;
      z-index: 0;
    }

    /* Container */
    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      text-align: center;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: var(--transition-standard);
    }

    .brand-badge:hover {
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.055);
    }

    .brand-icon-wrapper {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-icon {
      font-size: 11px;
      transform: translateY(-0.5px);
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #e2e8f0;
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Minimal Navy Card */
    .auth-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: 
        0 20px 48px -12px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .auth-card:hover {
      border-color: var(--border-hover);
      box-shadow: 
        0 24px 54px -12px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    /* Error Banner */
    .alert-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--danger-subtle);
      border: 1px solid var(--danger-border);
      color: #fca5a5;
      font-size: 13.5px;
      font-weight: 500;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 22px;
      animation: alertSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .alert-banner.active {
      display: flex;
    }

    .alert-icon {
      flex-shrink: 0;
      font-size: 15px;
    }

    @keyframes alertSlide {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .field-label-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #cbd5e1;
    }

    .forgot-link {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--accent-blue);
      text-decoration: none;
      transition: var(--transition-standard);
    }

    .forgot-link:hover {
      color: #93c5fd;
      text-decoration: underline;
    }

    .input-control-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-lead {
      position: absolute;
      left: 14px;
      color: var(--text-tertiary);
      font-size: 15px;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14.5px;
      color: var(--text-primary);
      transition: var(--transition-standard);
      outline: none;
    }

    .form-input::placeholder {
      color: var(--text-dim);
      font-weight: 400;
    }

    .form-input:hover {
      border-color: var(--border-hover);
      background: rgba(10, 18, 31, 0.8);
    }

    .form-input:focus {
      background: var(--bg-input-focus);
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-control-wrap:focus-within .input-icon-lead {
      color: var(--accent-blue);
    }

    /* Password Reveal Toggle */
    .toggle-visibility-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 14px;
      padding: 6px;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .toggle-visibility-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
    }

    /* Remember me */
    .form-row-aux {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .custom-checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
    }

    .custom-checkbox-wrap input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      cursor: pointer;
      outline: none;
      transition: var(--transition-standard);
      position: relative;
    }

    .custom-checkbox-wrap input[type="checkbox"]:hover {
      border-color: var(--border-hover);
    }

    .custom-checkbox-wrap input[type="checkbox"]:checked {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .custom-checkbox-wrap input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 2px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .checkbox-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Primary Submit Button */
    .submit-button {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--accent-blue);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      transition: var(--transition-standard);
      position: relative;
      overflow: hidden;
    }

    .submit-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transition: 0.5s ease;
    }

    .submit-button:hover:not(:disabled) {
      background: var(--accent-blue-hover);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
      transform: translateY(-1px);
    }

    .submit-button:hover::before {
      left: 100%;
    }

    .submit-button:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }

    .submit-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner */
    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.7s linear infinite;
    }

    .is-loading .btn-spinner {
      display: inline-block;
    }

    .is-loading .btn-label {
      opacity: 0.85;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Divider */
    .card-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .divider-text {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-tertiary);
    }

    /* Card Footer Callout */
    .card-footer {
      text-align: center;
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .card-footer a {
      color: var(--accent-blue);
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition-standard);
      margin-left: 4px;
    }

    .card-footer a:hover {
      color: #93c5fd;
      text-decoration: underline;
    }

    /* Bottom Trust & Security Notice */
    .trust-footer {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trust-icon {
      font-size: 12px;
      opacity: 0.75;
    }

    .trust-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      .brand-title {
        font-size: 23px;
      }

      .auth-card {
        padding: 26px 20px;
        border-radius: 16px;
      }

      .form-input {
        height: 44px;
        font-size: 14px;
      }

      .submit-button {
        height: 46px;
      }

      .trust-footer {
        flex-direction: column;
        gap: 6px;
      }

      .trust-dot {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <main class="page-wrapper">
    <!-- Header Brand Info -->
    <header class="brand-header">
      <div class="brand-badge">
        <span class="brand-icon-wrapper">
          <span class="brand-icon">💪</span>
        </span>
        <span class="brand-name">GymBro</span>
      </div>
      <h1 class="brand-title">Welcome back</h1>
      <p class="brand-subtitle">Enter your credentials to access your workout tracker</p>
    </header>

    <!-- Authentication Card -->
    <section class="auth-card" aria-label="Sign in to GymBro">
      <!-- Error Message Banner -->
      <div id="errorBanner" class="alert-banner" role="alert" aria-live="polite">
        <span class="alert-icon">⚠️</span>
        <span id="errorMessage" class="alert-text">Invalid username or password</span>
      </div>

      <form id="loginForm" novalidate>
        <!-- Username Field -->
        <div class="form-group">
          <div class="field-label-wrap">
            <label for="usernameInput" class="field-label">Username</label>
          </div>
          <div class="input-control-wrap">
            <span class="input-icon-lead">👤</span>
            <input 
              type="text" 
              id="usernameInput" 
              name="username" 
              class="form-input" 
              placeholder="e.g. alex_fitness" 
              autocomplete="username" 
              autocapitalize="none"
              spellcheck="false"
              required
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="field-label-wrap">
            <label for="passwordInput" class="field-label">Password</label>
            <a href="/forgot-password" class="forgot-link" tabindex="0">Forgot password?</a>
          </div>
          <div class="input-control-wrap">
            <span class="input-icon-lead">🔒</span>
            <input 
              type="password" 
              id="passwordInput" 
              name="password" 
              class="form-input" 
              placeholder="••••••••••••" 
              autocomplete="current-password" 
              required
            >
            <button 
              type="button" 
              id="togglePasswordBtn" 
              class="toggle-visibility-btn" 
              aria-label="Show password as plain text"
            >
              👁️
            </button>
          </div>
        </div>

        <!-- Auxiliary Row: Remember Device -->
        <div class="form-row-aux">
          <label class="custom-checkbox-wrap">
            <input type="checkbox" id="rememberMe">
            <span class="checkbox-label">Keep me signed in</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="submit-button">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-label">Sign In</span>
        </button>
      </form>

      <div class="card-divider">
        <span class="divider-line"></span>
        <span class="divider-text">or</span>
        <span class="divider-line"></span>
      </div>

      <!-- Registration link -->
      <footer class="card-footer">
        Don't have an account? 
        <a href="/register" id="registerLink">Register here</a>
      </footer>
    </section>

    <!-- Trust / Security Microcopy -->
    <aside class="trust-footer">
      <div class="trust-item">
        <span class="trust-icon">🛡️</span>
        <span>256-bit Encrypted</span>
      </div>
      <div class="trust-dot"></div>
      <div class="trust-item">
        <span class="trust-icon">⚡</span>
        <span>Zero Latency Sync</span>
      </div>
    </aside>
  </main>

  <!-- Interactive Logic & Micro-interactions -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const submitBtn = document.getElementById('submitBtn');
      const btnLabel = submitBtn.querySelector('.btn-label');
      const errorBanner = document.getElementById('errorBanner');
      const errorMessage = document.getElementById('errorMessage');

      // Autofocus username on desktop
      if (window.innerWidth > 640) {
        usernameInput.focus();
      }

      // Password visibility toggle with accessible state
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        togglePasswordBtn.textContent = isPassword ? '🙈' : '👁️';
      });

      // Clear alert on user typing
      const clearError = () => {
        if (errorBanner.classList.contains('active')) {
          errorBanner.classList.remove('active');
        }
      };

      usernameInput.addEventListener('input', clearError);
      passwordInput.addEventListener('input', clearError);

      // Submission handler with micro-interaction state
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        // Client-side quick validation
        if (!username || !password) {
          showError('Please enter both your username and password.');
          if (!username) usernameInput.focus();
          else passwordInput.focus();
          return;
        }

        // Loading state
        setLoading(true);

        try {
          await new Promise((resolve) => setTimeout(resolve, 800));
          
          btnLabel.textContent = 'Success!';
          submitBtn.style.background = '#10b981';
          submitBtn.style.borderColor = 'rgba(16, 185, 129, 0.4)';
          
          setTimeout(() => {
            console.log('Authentication initiated for:', username);
          }, 400);

        } catch (err) {
          showError(err.message || 'Unable to sign in. Please check your credentials.');
          setLoading(false);
        }
      });

      function showError(msg) {
        errorMessage.textContent = msg;
        errorBanner.classList.add('active');
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
          submitBtn.classList.add('is-loading');
          btnLabel.textContent = 'Verifying...';
        } else {
          submitBtn.classList.remove('is-loading');
          btnLabel.textContent = 'Sign In';
        }
      }
    });
  </script>
</body>
</html>
